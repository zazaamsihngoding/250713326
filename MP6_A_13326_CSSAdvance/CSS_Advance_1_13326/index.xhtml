
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Data Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Registrasi Data Mahasiswa</h1>

    <form action="" method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <td><strong><label for="namamhs">Nama Mahasiswa</label></strong></td>
                <td><input type="text" id="namamhs" name="namamhs" /></td>
            </tr>
            <tr>
                <td><strong>Jenis Kelamin</strong></td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                    <label for="laki">Laki-Laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td><strong><label for="prodi">Program Studi</label></strong></td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><strong><label for="email">Alamat Email</label></strong></td>
                <td><input type="text" id="email" name="email" /></td>
            </tr>
            <tr>
                <td><strong><label for="telepon">Nomor Telepon</label></strong></td>
                <td><input type="text" id="telepon" name="telepon" /></td>
            </tr>
            <tr>
                <td><strong><label for="password">Password</label></strong></td>
                <td><input type="password" id="password" name="password" /></td>
            </tr>
            <tr>
                <td><strong><label for="photo">Foto Mahasiswa</label></strong></td>
                <td><input type="file" id="photo" name="photo" accept="image/gif, image/jpeg, image/png" /></td>
            </tr>
            <tr>
                <td><strong><label for="namasmu">Nama Sekolah Asal</label></strong></td>
                <td><input type="text" id="namasmu" name="namasmu" /></td>
            </tr>
            <tr>
                <td style="vertical-align:top;"><strong>Hal Favorit</strong></td>
                <td>
                    <p>
                        <strong>Musik</strong><br />
                        <input type="checkbox" id="musik1" name="musik" value="Pop" />
                        <label for="musik1">Pop</label>
                        <input type="checkbox" id="musik2" name="musik" value="Rock" />
                        <label for="musik2">Rock</label>
                        <input type="checkbox" id="musik3" name="musik" value="Jazz" />
                        <label for="musik3">Jazz</label>
                    </p>
                    <p>
                        <strong>Film</strong><br />
                        <input type="checkbox" id="film1" name="film" value="Drama" />
                        <label for="film1">Drama</label>
                        <input type="checkbox" id="film2" name="film" value="Action" />
                        <label for="film2">Action</label>
                        <input type="checkbox" id="film3" name="film" value="Sci-Fi" />
                        <label for="film3">Sci-Fi</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="vertical-align:top;"><strong><label for="resume">Deskripsi Diri</label></strong></td>
                <td><textarea id="resume" name="resume" rows="10" cols="23"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan Data" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
